name: checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the xkb tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-tools x11-xkb-utils

      - name: Compile keymaps and assert on them
        run: ./tests/check-keymaps.sh

      - name: Run the tool's tests
        run: python3 -m unittest discover -s tests -v

      - name: Check that the embedded config still matches config/xkb/
        run: python3 xkb-caps-options.py --check-embedded
